@if (products.length > 0) {
    <h1>Products({{products.length}})</h1>
} 

<ul class="pill-group">
    @for (products of products; track products.id) {
        <li class="pill" (click)="selectedProduct = products">
            @switch (products.title) {
                @case ('Keyboard') { ⌨️ }
                @case ('Microphone') { 🎙️ }
                @default { 🏷️ }
            }  
            {{products.title}}</li>
    } @empty {
        <p>No Products found</p>
    }
</ul>

<app-product-detail [product]="selectedProduct" (added)="onAdded($event)">
    
</app-product-detail>
